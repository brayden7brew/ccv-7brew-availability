services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: availability
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - availability_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d availability']
      interval: 5s
      retries: 10
volumes:
  availability_pg:
