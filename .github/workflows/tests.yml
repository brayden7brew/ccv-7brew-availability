name: Tests
on: [push, pull_request]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testing
          POSTGRES_DB: availability_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-at-least-thirty-two-characters
      DATABASE_URL: postgresql+psycopg://postgres:testing@localhost:5432/availability_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:testing@localhost:5432/availability_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: python -m pytest -q
